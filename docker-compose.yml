services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: neuronest
      POSTGRES_USER: neuronest
      POSTGRES_PASSWORD: neuronest
    ports:
      - "5432:5432"
    volumes:
      - neuronest_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronest -d neuronest"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://neuronest:neuronest@db:5432/neuronest
      JWT_SECRET: replace-this-before-production
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  neuronest_pgdata:
